[project]
name = "browser-use-mini-agent"
version = "0.1.0"
description = "A minimal Python CLI demonstrating agent-based browser automation with browser-use. Opens a URL via an agent, extracts basic page information, and exports structured JSON."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "browser-use>=0.11.2",
    "python-dotenv>=1.2.1",
    "beautifulsoup4>=4.12.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]